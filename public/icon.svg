<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect with safe padding for maskable -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Shield Shape -->
  <path d="M 256 70 L 390 125 C 390 260 256 360 256 420 C 256 360 122 260 122 125 Z"
        fill="url(#shieldGrad)" opacity="0.25" />
  
  <path d="M 256 95 L 370 142 C 370 250 256 345 256 395 C 256 345 142 250 142 142 Z"
        fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Box / Package Icon -->
  <g transform="translate(166, 175)" filter="url(#glow)">
    <!-- Top Face -->
    <path d="M 90 0 L 170 42 L 90 84 L 10 42 Z" fill="#38bdf8" />
    <!-- Left Face -->
    <path d="M 10 42 L 90 84 L 90 170 L 10 128 Z" fill="#0284c7" />
    <!-- Right Face -->
    <path d="M 90 84 L 170 42 L 170 128 L 90 170 Z" fill="#0369a1" />
    <!-- Seam details -->
    <path d="M 90 0 L 90 84" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Barcode Overlay lines at bottom of box -->
  <g transform="translate(206, 280)">
    <rect x="0" y="0" width="5" height="36" fill="#10b981" rx="2" />
    <rect x="10" y="0" width="8" height="36" fill="#10b981" rx="2" />
    <rect x="23" y="0" width="4" height="36" fill="#10b981" rx="2" />
    <rect x="32" y="0" width="12" height="36" fill="#10b981" rx="2" />
    <rect x="50" y="0" width="5" height="36" fill="#10b981" rx="2" />
    <rect x="60" y="0" width="9" height="36" fill="#10b981" rx="2" />
    <rect x="74" y="0" width="4" height="36" fill="#10b981" rx="2" />
    <rect x="83" y="0" width="14" height="36" fill="#10b981" rx="2" />
  </g>

  <!-- Clock / Timer Freshness Gauge badge -->
  <g transform="translate(330, 290)">
    <circle cx="36" cy="36" r="38" fill="#0f172a" stroke="#10b981" stroke-width="6" />
    <circle cx="36" cy="36" r="32" fill="#059669" opacity="0.2" />
    <!-- Clock hands -->
    <path d="M 36 18 L 36 36 L 48 36" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="36" cy="36" r="4" fill="#ffffff" />
  </g>
</svg>
